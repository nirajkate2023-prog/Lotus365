<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#141c2c" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e676" />
      <stop offset="100%" stop-color="#00b0ff" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" />
  <!-- Cyber Grid Lines -->
  <g stroke="rgba(0,230,118,0.15)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="450" y1="0" x2="450" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>
  <!-- Glowing Shapes & Hexagons -->
  <polygon points="650,80 750,130 750,250 650,300 550,250 550,130" fill="none" stroke="url(#neonGlow)" stroke-width="3" opacity="0.6"/>
  <circle cx="200" cy="225" r="140" fill="none" stroke="#00b0ff" stroke-width="2" opacity="0.25"/>
  <circle cx="200" cy="225" r="100" fill="none" stroke="#00e676" stroke-dasharray="10 5" stroke-width="3" opacity="0.5"/>
  <!-- Central Emblem -->
  <polygon points="200,140 270,180 270,270 200,310 130,270 130,180" fill="url(#neonGlow)" opacity="0.85"/>
  <text x="400" y="380" font-family="Segoe UI, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="4">NEXT-GEN GAMING ARENA</text>
</svg>
